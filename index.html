<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12161A" />
    <title>Starlit — OKLCH scale studio</title>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div>
          <h1>Starlit</h1>
          <p>Hue-shifting OKLCH token scales, lit like the real world.</p>
        </div>
        <div class="header-meta">
          <a
            class="gh-link"
            href="https://github.com/villetakanen/starlit"
            target="_blank"
            rel="noopener"
            aria-label="Starlit on GitHub"
          >
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
            <span>GitHub</span>
          </a>
          <span class="version" id="version"></span>
        </div>
      </div>
    </header>
    <div id="app">
      <main class="dashboard">
        <section class="presets card" aria-labelledby="presets-title">
          <h2 class="panel-title" id="presets-title">Physical material presets</h2>
          <div class="preset-grid" id="presets"></div>
        </section>

        <section class="telemetry card" aria-labelledby="telemetry-title">
          <h2 class="panel-title" id="telemetry-title">Waveform telemetry</h2>
          <div id="telemetry" tabindex="0" role="slider" aria-label="Selected step" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
          <div class="telemetry-legend">
            <span class="legend-line" aria-hidden="true"></span>
            <span>Natural light hue shift</span>
            <span class="legend-line accent" aria-hidden="true"></span>
            <span>Chroma 0–0.4</span>
            <span class="legend-line dotted" aria-hidden="true"></span>
            <span>Luminance</span>
          </div>
        </section>

        <section class="channel-strip card" aria-labelledby="channel-title">
          <h2 class="panel-title" id="channel-title">Channel strip</h2>
          <div class="channel-blocks">
            <fieldset class="step-selector" id="strip" aria-label="Step selector"></fieldset>
            <div class="readout" id="inspector" aria-live="polite"></div>
          </div>
        </section>

        <section class="controls card" aria-label="Tuning controls">
        <label class="field">
          <span class="field-label">Token family name</span>
          <input type="text" id="name" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">Local anchor hue <output id="anchorHue-out"></output></span>
          <input type="range" id="anchorHue" min="0" max="360" step="1" />
        </label>
        <label class="field">
          <span class="field-label">Solar extinction <output id="solarHue-out"></output></span>
          <input type="range" id="solarHue" min="75" max="105" step="1" />
        </label>
        <label class="field">
          <span class="field-label">Rayleigh sky scattering <output id="skyFactor-out"></output></span>
          <input type="range" id="skyFactor" min="0" max="1" step="0.05" />
        </label>
        <label class="field field-toggle">
          <span class="field-label">Subsurface extinction</span>
          <input type="checkbox" id="subsurface" />
        </label>
        <label class="field">
          <span class="field-label">Peak midtone chroma <output id="peakChroma-out"></output></span>
          <input type="range" id="peakChroma" min="0.01" max="0.32" step="0.005" />
        </label>
        <label class="field">
          <span class="field-label">Solar glimmer <output id="glimmer-out"></output></span>
          <input type="range" id="glimmer" min="0" max="2" step="0.05" />
        </label>
      </section>

      <section class="output card" aria-label="CSS tokens">
        <div class="output-head">
          <h2>CSS tokens</h2>
          <button type="button" id="copy">Copy CSS</button>
        </div>
          <pre id="css"><code></code></pre>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
